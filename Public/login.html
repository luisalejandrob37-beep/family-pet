<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Family Pet</title>

    <link rel="stylesheet" href="estilos.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header>

    <div class="logo">

        <img
            src="https://cdn-icons-png.flaticon.com/512/616/616408.png"
            alt="Family Pet">

        <div>

            <h1>Family Pet</h1>

            <span>Dando una Segunda Oportunidad</span>

        </div>

    </div>

</header>


<section class="login-section">

    <div class="login-card">

        <i class="fa-solid fa-user-circle icon-login"></i>

        <h2>Iniciar Sesión</h2>

        <p>Ingresa a tu cuenta de Family Pet</p>


        <form id="loginForm">

            <label for="correo">
                Correo electrónico
            </label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo electrónico"
                    required>

            </div>


            <label for="password">
                Contraseña
            </label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required>

            </div>


            <button
                type="submit"
                class="btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Ingresar

            </button>


            <p id="mensaje"></p>

        </form>


        <div class="registro-link">

            ¿No tienes cuenta?

            <a href="registro.html">
                Registrarse
            </a>

        </div>


        <a
            href="family_pet.html"
            class="volver">

            ← Volver al inicio

        </a>

    </div>

</section>


<script>

// =====================================
// FAMILY PET - LOGIN
// =====================================

// IMPORTANTE:
// No utilizar localhost.
//
// Render y el navegador utilizan
// el mismo dominio.
//
// Login:
// /api/login

const formulario =
    document.getElementById("loginForm");


formulario.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();


        const correo =
            document
                .getElementById("correo")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const mensaje =
            document.getElementById("mensaje");


        mensaje.style.color = "blue";

        mensaje.innerHTML =
            "⏳ Conectando con el servidor...";


        try {

            const respuesta = await fetch(
                "/api/login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        correo: correo,

                        password: password

                    })

                }
            );


            // =====================================
            // LEER RESPUESTA
            // =====================================

            const datos =
                await respuesta.json();


            // =====================================
            // LOGIN CORRECTO
            // =====================================

            if (respuesta.ok) {

                if (datos.usuario) {

                    localStorage.setItem(
                        "usuario",
                        JSON.stringify(
                            datos.usuario
                        )
                    );

                }


                localStorage.setItem(
                    "usuarioLogueado",
                    "true"
                );


                mensaje.style.color =
                    "green";

                mensaje.innerHTML =
                    "✅ Inicio de sesión correcto";


                setTimeout(() => {

                    window.location.href =
                        "family_pet.html";

                }, 1000);


            } else {

                mensaje.style.color =
                    "red";

                mensaje.innerHTML =
                    "❌ " +
                    (
                        datos.mensaje ||
                        "Correo o contraseña incorrectos."
                    );

            }


        } catch (error) {

            console.error(
                "Error de conexión:",
                error
            );


            mensaje.style.color =
                "red";

            mensaje.innerHTML =
                "❌ No se pudo conectar con el servidor.";

        }

    }
);

</script>

</body>

</html>
