<script>
// =====================================
// FAMILY PET - LOGIN
// =====================================

// =====================================
// DIRECCIÓN DE LA API
// =====================================

// Servidor Node.js de Family Pet
const API_LOGIN = "http://localhost:3000/api/login";


// =====================================
// FORMULARIO
// =====================================

const formulario = document.getElementById("loginForm");
const mensaje = document.getElementById("mensaje");


// =====================================
// COMPROBAR QUE EXISTE EL FORMULARIO
// =====================================

if (formulario) {

    formulario.addEventListener("submit", async (e) => {

        e.preventDefault();


        // =================================
        // OBTENER DATOS
        // =================================

        const campoCorreo = document.getElementById("correo");
        const campoPassword = document.getElementById("password");

        if (!campoCorreo || !campoPassword) {

            console.error(
                "No se encontraron los campos correo o password."
            );

            return;
        }

        const correo = campoCorreo.value.trim();
        const password = campoPassword.value;


        // =================================
        // VALIDAR DATOS
        // =================================

        if (!correo || !password) {

            if (mensaje) {

                mensaje.style.color = "red";

                mensaje.textContent =
                    "❌ Debes ingresar correo y contraseña.";

            }

            return;
        }


        // =================================
        // MENSAJE DE CARGA
        // =================================

        if (mensaje) {

            mensaje.style.color = "blue";

            mensaje.textContent =
                "⏳ Conectando con el servidor...";

        }


        // =================================
        // ENVIAR LOGIN
        // =================================

        try {

            console.log(
                "Enviando login a:",
                API_LOGIN
            );


            const respuesta = await fetch(API_LOGIN, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    correo: correo,

                    password: password

                })

            });


            // =================================
            // LEER RESPUESTA
            // =================================

            let datos;

            try {

                datos = await respuesta.json();

            } catch (error) {

                datos = {
                    mensaje:
                        "El servidor no devolvió una respuesta válida."
                };

            }


            console.log(
                "Respuesta del servidor:",
                datos
            );


            // =================================
            // LOGIN CORRECTO
            // =================================

            if (respuesta.ok) {


                // =================================
                // GUARDAR USUARIO
                // =================================

                if (datos.usuario) {

                    localStorage.setItem(
                        "usuario",
                        JSON.stringify(datos.usuario)
                    );

                }


                // =================================
                // MARCAR SESIÓN
                // =================================

                localStorage.setItem(
                    "usuarioLogueado",
                    "true"
                );


                // =================================
                // MENSAJE
                // =================================

                if (mensaje) {

                    mensaje.style.color = "green";

                    mensaje.textContent =
                        "✅ Inicio de sesión correcto";

                }


                // =================================
                // REDIRECCIÓN
                // =================================

                setTimeout(() => {

                    window.location.href =
                        "family_pet.html";

                }, 1000);


            } else {


                // =================================
                // ERROR DE LOGIN
                // =================================

                if (mensaje) {

                    mensaje.style.color = "red";

                    mensaje.textContent =
                        "❌ " +
                        (
                            datos.mensaje ||
                            "Correo o contraseña incorrectos."
                        );

                }

            }


        } catch (error) {


            // =================================
            // ERROR DE CONEXIÓN
            // =================================

            console.error(
                "Error de conexión:",
                error
            );


            if (mensaje) {

                mensaje.style.color = "red";

                mensaje.textContent =
                    "❌ No se pudo conectar con el servidor. " +
                    "Verifica que Node.js esté ejecutándose en el puerto 3000.";

            }

        }

    });

}
