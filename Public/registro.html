<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | Family Pet</title>

    <link rel="stylesheet" href="estilos.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <section class="login-section">

        <div class="login-card">

            <i class="fa-solid fa-user-plus icon-login"></i>

            <h2>Crear cuenta</h2>

            <p>Regístrate en Family Pet</p>


            <form id="registroForm">


                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre"
                    required>


                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    placeholder="Apellido"
                    required>


                <label for="usuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Nombre de usuario"
                    required>


                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo electrónico"
                    required>


                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="Teléfono"
                    required>


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required>


                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar"
                    placeholder="Confirmar contraseña"
                    required>


                <button
                    type="submit"
                    class="btn-login2">

                    <i class="fa-solid fa-user-plus"></i>

                    Registrarse

                </button>


                <p id="mensaje"></p>

            </form>


            <div class="registro-link">

                ¿Ya tienes cuenta?

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>


            <a
                href="family_pet.html"
                class="volver">

                ← Volver al inicio

            </a>

        </div>

    </section>


<script>

// =====================================
// FAMILY PET - REGISTRO
// =====================================

// NO UTILIZAR:
// http://localhost:3000
//
// Render utiliza el mismo dominio.
//
// Registro:
// /api/registro


const formulario =
    document.getElementById("registroForm");


formulario.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        // =====================================
        // OBTENER DATOS
        // =====================================

        const nombre =
            document
                .getElementById("nombre")
                .value
                .trim();


        const apellido =
            document
                .getElementById("apellido")
                .value
                .trim();


        const usuario =
            document
                .getElementById("usuario")
                .value
                .trim();


        const correo =
            document
                .getElementById("correo")
                .value
                .trim();


        const telefono =
            document
                .getElementById("telefono")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmar =
            document
                .getElementById("confirmar")
                .value;


        const mensaje =
            document.getElementById("mensaje");


        // =====================================
        // VALIDAR CONTRASEÑAS
        // =====================================

        if (password !== confirmar) {

            mensaje.style.color = "red";

            mensaje.innerHTML =
                "❌ Las contraseñas no coinciden.";

            return;

        }


        mensaje.style.color = "blue";

        mensaje.innerHTML =
            "⏳ Registrando usuario...";


        try {


            // =====================================
            // ENVIAR AL BACKEND
            // =====================================

            const respuesta = await fetch(
                "/api/registro",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        nombre,
                        apellido,
                        usuario,
                        correo,
                        telefono,
                        password

                    })

                }
            );


            // =====================================
            // LEER RESPUESTA
            // =====================================

            const datos =
                await respuesta.json();


            // =====================================
            // REGISTRO CORRECTO
            // =====================================

            if (respuesta.ok) {

                mensaje.style.color =
                    "green";

                mensaje.innerHTML =
                    "✅ Usuario registrado correctamente.";


                document
                    .getElementById("registroForm")
                    .reset();


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);


            } else {

                mensaje.style.color =
                    "red";

                mensaje.innerHTML =
                    "❌ " +
                    (
                        datos.mensaje ||
                        "No se pudo registrar el usuario."
                    );

            }


        } catch (error) {

            console.error(
                "Error de conexión:",
                error
            );


            mensaje.style.color =
                "red";

            mensaje.innerHTML =
                "❌ No se pudo conectar con el servidor.";

        }

    }
);

</script>

</body>

</html>
