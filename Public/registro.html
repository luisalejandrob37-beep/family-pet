<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | Family Pet</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {

            font-family: 'Poppins', sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #008f78,
                    #00a88f
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;

        }


        /* =========================================
           CONTENEDOR
        ========================================= */

        .registro-section {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================================
           TARJETA
        ========================================= */

        .registro-card {

            width: 100%;

            max-width: 380px;

            background: #ffffff;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.18);

        }


        /* =========================================
           ICONO
        ========================================= */

        .icon-registro {

            display: block;

            text-align: center;

            font-size: 42px;

            color: #46355f;

            margin-bottom: 12px;

        }


        /* =========================================
           TITULO
        ========================================= */

        .registro-card h2 {

            text-align: center;

            color: #00846f;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 3px;

        }


        /* =========================================
           SUBTITULO
        ========================================= */

        .registro-card > p {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* =========================================
           FORMULARIO
        ========================================= */

        #registroForm {

            width: 100%;

        }


        /* =========================================
           LABEL
        ========================================= */

        label {

            display: block;

            font-size: 15px;

            font-weight: 600;

            color: #222;

            margin-bottom: 6px;

        }


        /* =========================================
           INPUT
        ========================================= */

        input {

            width: 100%;

            height: 46px;

            padding: 0 15px;

            border: 1px solid #cfcfcf;

            border-radius: 11px;

            outline: none;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            color: #333;

            margin-bottom: 16px;

            transition: 0.2s;

        }


        /* =========================================
           INPUT FOCUS
        ========================================= */

        input:focus {

            border-color: #008f78;

            box-shadow:
                0 0 0 2px rgba(0, 143, 120, 0.12);

        }


        /* =========================================
           BOTON
        ========================================= */

        .btn-registro {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 10px;

            background: #00866f;

            color: #ffffff;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            margin-top: 3px;

        }


        .btn-registro:hover {

            background: #00745f;

        }


        .btn-registro:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }


        .btn-registro i {

            margin-right: 7px;

        }


        /* =========================================
           MENSAJE
        ========================================= */

        #mensaje {

            text-align: center;

            font-size: 13px;

            font-weight: 600;

            margin-top: 18px;

            min-height: 20px;

        }


        /* =========================================
           LINK LOGIN
        ========================================= */

        .registro-link {

            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #777;

        }


        .registro-link a {

            color: #008f78;

            text-decoration: none;

            font-weight: 700;

        }


        .registro-link a:hover {

            text-decoration: underline;

        }


        /* =========================================
           VOLVER
        ========================================= */

        .volver {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;

            font-size: 13px;

        }


        .volver:hover {

            color: #008f78;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 480px) {

            body {

                padding: 20px 12px;

                align-items: flex-start;

            }


            .registro-card {

                padding: 28px 22px;

                margin-top: 10px;

            }


            .registro-card h2 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         REGISTRO
    ========================================= -->

    <section class="registro-section">


        <div class="registro-card">


            <!-- ICONO -->

            <i class="fa-solid fa-user-plus icon-registro"></i>


            <!-- TITULO -->

            <h2>
                Crear cuenta
            </h2>


            <!-- SUBTITULO -->

            <p>
                Regístrate en Family Pet
            </p>


            <!-- =====================================
                 FORMULARIO
            ====================================== -->

            <form id="registroForm">


                <!-- NOMBRE -->

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ingrese su nombre"
                    autocomplete="given-name"
                    required>


                <!-- APELLIDO -->

                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    placeholder="Ingrese su apellido"
                    autocomplete="family-name"
                    required>


                <!-- USUARIO -->

                <label for="usuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese su usuario"
                    autocomplete="username"
                    required>


                <!-- CORREO -->

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Ingrese su correo"
                    autocomplete="email"
                    required>


                <!-- TELEFONO -->

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="Ingrese su teléfono"
                    autocomplete="tel"
                    required>


                <!-- CONTRASEÑA -->

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña"
                    autocomplete="new-password"
                    required>


                <!-- CONFIRMAR -->

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar"
                    placeholder="Confirme su contraseña"
                    autocomplete="new-password"
                    required>


                <!-- BOTON -->

                <button
                    type="submit"
                    class="btn-registro"
                    id="btnRegistro">

                    <i class="fa-solid fa-user-plus"></i>

                    Registrarse

                </button>


                <!-- MENSAJE -->

                <p id="mensaje"></p>


            </form>


            <!-- =====================================
                 LOGIN
            ====================================== -->

            <div class="registro-link">

                ¿Ya tienes una cuenta?

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>


            <!-- =====================================
                 VOLVER
            ====================================== -->

            <a
                href="family_pet.html"
                class="volver">

                ← Volver a Family Pet

            </a>


        </div>


    </section>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        // =====================================
        // FAMILY PET - REGISTRO
        // =====================================


        const formulario =
            document.getElementById("registroForm");

        const mensaje =
            document.getElementById("mensaje");

        const btnRegistro =
            document.getElementById("btnRegistro");


        // =====================================
        // ENVIAR FORMULARIO
        // =====================================

        formulario.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                // =================================
                // OBTENER DATOS
                // =================================

                const nombre =
                    document
                        .getElementById("nombre")
                        .value
                        .trim();


                const apellido =
                    document
                        .getElementById("apellido")
                        .value
                        .trim();


                const usuario =
                    document
                        .getElementById("usuario")
                        .value
                        .trim();


                const correo =
                    document
                        .getElementById("correo")
                        .value
                        .trim();


                const telefono =
                    document
                        .getElementById("telefono")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmar =
                    document
                        .getElementById("confirmar")
                        .value;


                // =================================
                // VALIDAR CONTRASEÑAS
                // =================================

                if (password !== confirmar) {

                    mensaje.style.color = "red";

                    mensaje.innerHTML =
                        "❌ Las contraseñas no coinciden.";

                    return;

                }


                // =================================
                // MOSTRAR PROCESO
                // =================================

                mensaje.style.color = "#008f78";

                mensaje.innerHTML =
                    "⏳ Registrando usuario...";


                btnRegistro.disabled = true;

                btnRegistro.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Registrando...';


                try {


                    // =================================
                    // ENVIAR AL SERVIDOR
                    // =================================

                    const respuesta = await fetch(
                        "/api/registro",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                nombre,
                                apellido,
                                usuario,
                                correo,
                                telefono,
                                password

                            })

                        }
                    );


                    // =================================
                    // LEER RESPUESTA
                    // =================================

                    const datos =
                        await respuesta.json();


                    // =================================
                    // REGISTRO CORRECTO
                    // =================================

                    if (respuesta.ok) {

                        mensaje.style.color =
                            "green";

                        mensaje.innerHTML =
                            "✅ Usuario registrado correctamente.";


                        formulario.reset();


                        btnRegistro.disabled =
                            false;

                        btnRegistro.innerHTML =
                            '<i class="fa-solid fa-user-plus"></i> Registrarse';


                        // Ir al Login

                        setTimeout(() => {

                            window.location.href =
                                "login.html";

                        }, 1500);


                    }

                    // =================================
                    // ERROR DEL SERVIDOR
                    // =================================

                    else {

                        mensaje.style.color =
                            "red";

                        mensaje.innerHTML =
                            "❌ " +
                            (
                                datos.mensaje ||
                                "No se pudo registrar el usuario."
                            );


                        btnRegistro.disabled =
                            false;

                        btnRegistro.innerHTML =
                            '<i class="fa-solid fa-user-plus"></i> Registrarse';

                    }


                }

                // =====================================
                // ERROR DE CONEXION
                // =====================================

                catch (error) {

                    console.error(
                        "Error de conexión:",
                        error
                    );


                    mensaje.style.color =
                        "red";

                    mensaje.innerHTML =
                        "❌ No se pudo conectar con el servidor.";


                    btnRegistro.disabled =
                        false;

                    btnRegistro.innerHTML =
                        '<i class="fa-solid fa-user-plus"></i> Registrarse';

                }

            }
        );

    </script>


</body>

</html>
